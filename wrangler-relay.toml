# Relay Worker Config Template
# Copy this and customize for each CF account
# Or use deploy-multi.sh for automatic setup

name = "claw-relay-1"  # Change for each account
main = "relay.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Shared secret - must match RELAY_SECRET on main Worker
RELAY_SECRET = "change-me-to-random-string"

# Optional: custom domain routing
# [[routes]]
# pattern = "relay.yourdomain.com/relay"
# zone_name = "yourdomain.com"
